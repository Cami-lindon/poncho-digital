{% extends "base/base.html" %}

{% block titulo %}Eliminar producto{% endblock %}

{% block contenido_principal %}
<section class="container my-4">
    <h2 class="principal">Eliminar producto</h2>
</section>

<section class="container mb-5">
    <div class="card shadow-sm border-0">
        <div class="card-body p-4">
            <p>
                ¿Estás seguro de que querés eliminar el producto
                <strong>{{ producto.nombre }}</strong>? Esta acción no se puede deshacer.
            </p>

            <form method="post" class="d-flex gap-2">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Sí, eliminar</button>
                <a href="{% url 'productos:detalle_producto' producto.pk %}" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </div>
</section>
{% endblock %}
