{% extends "base/base.html" %}
{% load static %}
{% block titulo %}Inicio Sesión{% endblock %}
{% block css %} <link rel="stylesheet" href="{% static 'css/portada.css' %}"> {% endblock %}
{% block contenido_principal %}
<main class="container">
    <section id="home">
        <h2>Login de Usuario</h2>
        <p>Ingrese sus credenciales para Ingresar al Sistema</p>
    </section>
    <hr class="w-75">
    <br>
    {% if msj %}
        <div>{{ msj }}</div>
    {% endif %}
    <form action="{% url 'usuario:login' %}" method="post" class="w-75">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label" for="username">Nombre de Usuario: </label>
            <input type="text" id="username" name="username" class="form-control" >
        </div>
        <div class="mb-3">
            <label class="form-label" for="passw">Contraseña: </label>
            <input type="password" id="passw" name="password" class="form-control" >
        </div>
        <input type="submit" class="btn btn-primary" value="Login">
    </form>
</main>
{% endblock %}
